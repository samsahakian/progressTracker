name: Inspect logbook (temporary)

on:
  workflow_dispatch:
    inputs:
      since:
        default: "2026-11-12"
      until:
        default: "2026-11-16"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump results in range (all machines, no comments)
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          OUT_DIR: ${{ runner.temp }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          C2_REFRESH_TOKEN="$(bash tools/token_state.sh load)"
          echo "::add-mask::$C2_REFRESH_TOKEN"
          C2_REFRESH_TOKEN="$C2_REFRESH_TOKEN" python3 c2auth.py refresh
          bash tools/token_state.sh save "$OUT_DIR/refresh_token"
          C2_TOKEN="$(cat "$OUT_DIR/access_token")" python3 sync.py --machine all --since "$SINCE" --out "$OUT_DIR/r.json"
          python3 - "$OUT_DIR/r.json" "$UNTIL" <<'EOF'
          import json, sys
          for r in json.load(open(sys.argv[1])):
              if r.get("date", "")[:10] > sys.argv[2]:
                  continue
              r.pop("comments", None); r.pop("stroke_data", None)
              print(json.dumps(r, sort_keys=True))
          EOF
          rm -f "$OUT_DIR"/access_token "$OUT_DIR"/refresh_token
