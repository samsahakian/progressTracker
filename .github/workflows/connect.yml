name: Connect Concept2

# One-time setup: run this with the address you land on after approving access on Concept2.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "The whole localhost:8080/callback?code=... address from the address bar"
        required: true

permissions:
  contents: write   # to save the encrypted token on the c2-state branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange code for tokens and save the refresh token
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          python3 c2auth.py exchange "$CODE"
          bash tools/token_state.sh save "$OUT_DIR/refresh_token"
          rm -f "$OUT_DIR/access_token" "$OUT_DIR/refresh_token"
          echo "Connected. Now run the 'Update dashboard' workflow."
