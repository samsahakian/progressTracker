name: Connect Concept2

# One-time setup: run this with the code from the Concept2 approval redirect.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "The code= value (or the whole localhost URL) from the address bar after approving"
        required: true

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange code for tokens and save the refresh token
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          python3 c2auth.py exchange "$CODE"
          gh secret set C2_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$OUT_DIR/refresh_token"
          rm -f "$OUT_DIR/access_token" "$OUT_DIR/refresh_token"
          echo "Connected. Now run the 'Update dashboard' workflow."
