name: Update dashboard

on:
  # Chicago time: weekdays 4:47 and 5:47, weekends 7:47 and 8:47 (two tries each, off the
  # half hour, well before the 6:55 / 9:55 coach review — GitHub schedules can run hours late
  # or be skipped). GitHub cron is UTC, so each time is listed for both standard (UTC-6) and
  # daylight (UTC-5) time; the gate job runs only the one that matches today.
  schedule:
    - cron: "47 10,11 * * 1-5"   # 4:47, 5:47 CST
    - cron: "47 9,10 * * 1-5"    # 4:47, 5:47 CDT
    - cron: "47 13,14 * * 0,6"   # 7:47, 8:47 CST
    - cron: "47 12,13 * * 0,6"   # 7:47, 8:47 CDT
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: write   # to save the rotated, encrypted Concept2 token on the c2-state branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          off=$(TZ=America/Chicago date +%z)   # -0600 standard, -0500 daylight
          run=true
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "47 10,11 * * 1-5"|"47 13,14 * * 0,6") [ "$off" = "-0600" ] || run=false ;;
              "47 9,10 * * 1-5"|"47 12,13 * * 0,6") [ "$off" = "-0500" ] || run=false ;;
            esac
          fi
          echo "Chicago offset $off, schedule '$CRON' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Concept2 hands out a new refresh token each time one is used, so it is
      # saved (encrypted, on the c2-state branch) straight away, before anything else can fail.
      - name: Refresh Concept2 token
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          C2_REFRESH_TOKEN="$(bash tools/token_state.sh load)"
          echo "::add-mask::$C2_REFRESH_TOKEN"
          C2_REFRESH_TOKEN="$C2_REFRESH_TOKEN" python3 c2auth.py refresh
          bash tools/token_state.sh save "$OUT_DIR/refresh_token"
          rm -f "$OUT_DIR/refresh_token"

      # Per-stroke data is cached between runs (Actions cache is private to the repo),
      # so only new sessions are downloaded each day.
      - name: Restore stroke cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/strokes
            data/fit
          key: strokes-${{ github.run_id }}
          restore-keys: strokes-

      - name: Pull Concept2 Logbook
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          C2_TOKEN="$(cat "$OUT_DIR/access_token")" python3 sync.py

      - name: Pull per-stroke data
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}
        run: C2_TOKEN="$(cat "$OUT_DIR/access_token")" python3 strokes.py

      - name: Forget access token
        if: always()
        run: rm -f "${{ runner.temp }}/access_token"

      # Optional: skipped until GARMIN_API_KEY is set. A Garmin problem never blocks the erg dashboard.
      - name: Pull Garmin on-water sessions
        continue-on-error: true
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          if [ -z "$GARMIN_API_KEY" ]; then echo "Garmin not set up; skipping."; exit 0; fi
          python3 garmin.py

      # Optional: skipped until HEVY_API_KEY is set (needs Hevy Pro). Never blocks the rowing dashboard.
      - name: Pull Hevy lifting
        continue-on-error: true
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          if [ -z "$HEVY_API_KEY" ]; then echo "Hevy not set up; skipping."; exit 0; fi
          python3 hevy.py

      - name: Save stroke and FIT cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/strokes
            data/fit
          key: strokes-${{ github.run_id }}

      - name: Build dashboard
        run: python3 build.py

      # The coach's daily review runs in a cloud sandbox that can clone public GitHub repos but can't open
      # github.io. Keep the latest summary and data (the same data the public page already shows) on their
      # own branch, one commit, force-pushed, so the repo doesn't grow. A failure here never blocks the deploy.
      - name: Save data snapshot to the dashboard-data branch
        continue-on-error: true
        run: |
          idx=$(git hash-object -w site/index.html)
          dat=$(git hash-object -w site/data.json)
          sum=$(git hash-object -w site/summary.md)
          tree=$(printf '100644 blob %s\tdata.json\n100644 blob %s\tindex.html\n100644 blob %s\tsummary.md\n' "$dat" "$idx" "$sum" | git mktree)
          commit=$(GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=github-actions@users.noreply.github.com \
                   GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=github-actions@users.noreply.github.com \
                   git commit-tree "$tree" -m "Dashboard data $(TZ=America/Chicago date '+%Y-%m-%d %H:%M')")
          git push -q -f origin "$commit:refs/heads/dashboard-data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
