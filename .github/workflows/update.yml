name: Update dashboard

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~5–6 am Central
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: write   # to save the rotated, encrypted Concept2 token on the c2-state branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Concept2 hands out a new refresh token each time one is used, so it is
      # saved (encrypted, on the c2-state branch) straight away, before anything else can fail.
      - name: Refresh Concept2 token
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          C2_REFRESH_TOKEN="$(bash tools/token_state.sh load)"
          echo "::add-mask::$C2_REFRESH_TOKEN"
          C2_REFRESH_TOKEN="$C2_REFRESH_TOKEN" python3 c2auth.py refresh
          bash tools/token_state.sh save "$OUT_DIR/refresh_token"
          rm -f "$OUT_DIR/refresh_token"

      # Per-stroke data is cached between runs (Actions cache is private to the repo),
      # so only new sessions are downloaded each day.
      - name: Restore stroke cache
        uses: actions/cache/restore@v4
        with:
          path: data/strokes
          key: strokes-${{ github.run_id }}
          restore-keys: strokes-

      - name: Pull Concept2 Logbook
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          C2_TOKEN="$(cat "$OUT_DIR/access_token")" python3 sync.py

      - name: Pull per-stroke data
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}
        run: C2_TOKEN="$(cat "$OUT_DIR/access_token")" python3 strokes.py

      - name: Save stroke cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/strokes
          key: strokes-${{ github.run_id }}

      - name: Forget access token
        if: always()
        run: rm -f "${{ runner.temp }}/access_token"

      # Optional: skipped until GARMIN_API_KEY is set. A Garmin problem never blocks the erg dashboard.
      - name: Pull Garmin on-water sessions
        continue-on-error: true
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          if [ -z "$GARMIN_API_KEY" ]; then echo "Garmin not set up; skipping."; exit 0; fi
          python3 garmin.py

      - name: Build dashboard
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
