name: Connect Strava

# One-time setup: run this with the address you land on after approving access on Strava.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "The whole http://localhost/?...code=... address from the address bar"
        required: true

permissions:
  contents: write   # to save the encrypted token on the c2-state branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange code for tokens and save the refresh token
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}   # encryption key for the stored token
          CODE: ${{ inputs.code }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          python3 strava.py exchange "$CODE"
          bash tools/token_state.sh save "$OUT_DIR/strava_refresh_token" strava
          rm -f "$OUT_DIR"/strava_*
          echo "Connected. Now run the 'Update dashboard' workflow."
